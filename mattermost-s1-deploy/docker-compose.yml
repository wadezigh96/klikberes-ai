# Mattermost S1 dynamic-test instance (Bugcrowd / channel-export ABAC bypass).
# Self-hosted, single-purpose, NOT for production. See README.md.
#
# Pinned server: mattermost/mattermost-team-edition:11.11.4
#   - Test plan (../poc/S1-test-plan.md §1.1) requires >= v11.9: the line that
#     ships ABAC channel permission policies and the channel_access.go
#     enforcement the audit cites.
#   - 11.11.4 (released 2026-11-05) is the newest patch of the newest v11
#     feature release — reproducible, and current enough that a "fixed in a
#     newer release" surprise is unlikely.
#   - The team-edition image carries the Enterprise code; the Enterprise
#     Advanced features are unlocked by the trial license (see
#     ENFORCEMENT-CHECKLIST.md). Dev-mode does NOT unlock ABAC enforcement.
#
# Fits a 2-core / 8 GB host (e.g. the "cautious space potato" Codespace).

services:
  postgres:
    image: postgres:15-alpine
    container_name: s1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mattermost
      POSTGRES_USER: mmuser
      # Placeholder for a throwaway test instance only — override via .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mmuser_password_change_me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 5s
      timeout: 3s
      retries: 12

  mattermost:
    image: mattermost/mattermost-team-edition:11.11.4
    container_name: s1-mattermost
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8065:8065"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:${POSTGRES_PASSWORD:-mmuser_password_change_me}@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      # Test plan §1.4: the ChannelPermissionActions feature flag MUST be on
      # or core performs no policy enforcement at all.
      MM_FEATUREFLAGS_CHANNELPERMISSIONACTIONS: "true"
      # Allow uploading the locally built plugin bundle via the API/console.
      MM_PLUGINSETTINGS_ENABLE: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
    volumes:
      - mattermost-config:/mattermost/config
      - mattermost-data:/mattermost/data
      - mattermost-logs:/mattermost/logs
      - mattermost-plugins:/mattermost/plugins
      - mattermost-client-plugins:/mattermost/client/plugins

volumes:
  postgres-data:
  mattermost-config:
  mattermost-data:
  mattermost-logs:
  mattermost-plugins:
  mattermost-client-plugins:
