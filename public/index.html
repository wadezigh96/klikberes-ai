<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KlikBeres AI</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="logo">KlikBeres AI</div>
    <button id="langToggle" class="ghost">EN / ID</button>
  </header>

  <main>
    <section class="hero">
      <h1 data-i18n="hero">Less busywork</h1>
      <p data-i18n="sub">Describe a task. Review the plan. Approve it. We run a safe local demo and record evidence.</p>
    </section>

    <section class="composer">
      <input id="taskInput" placeholder="Fill the demo community volunteer registration form" />
      <button id="buildPlan">Build my plan</button>
      <button id="reset" class="ghost">Reset demo</button>
    </section>

    <section id="tasks"></section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
